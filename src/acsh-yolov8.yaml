# Parameters
nc: 1 
scales: # 모델 크기 (YOLOv8s 기준)
  s: [0.33, 0.50, 1024] 

backbone:
  - [-1, 1, Conv, [64, 3, 2]]    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]   # 1-P2/4
  - [-1, 3, C2f, [128, True]]    # 2 
  - [-1, 1, Conv, [256, 3, 2]]   # 3-P3/8
  - [-1, 6, C2f, [256, True]]    # 4
  - [-1, 1, Conv, [512, 3, 2]]   # 5-P4/16
  - [-1, 6, C2f, [512, True]]    # 6
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 3, C2f, [1024, True]]   # 8
  - [-1, 1, SPPF, [1024, 5]]     # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 10
  - [[-1, 6], 1, Concat, [1]]  
  - [-1, 3, C2f_ACmix, [512]]  # 12 

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 13
  - [[-1, 4], 1, Concat, [1]]  
  - [-1, 3, C2f_ACmix, [256]]  # 15

  # 🚀 P2를 위한 Top-down 경로
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 16
  - [[-1, 2], 1, Concat, [1]]  
  - [-1, 3, C2f_ACmix, [128]]  # 18 [Output: P2-Head용 데이터]

  # 🚀 P2에서 다시 내려가는 Bottom-up 경로
  - [-1, 1, Conv, [128, 3, 2]] # 19 (다운샘플링)
  - [[-1, 15], 1, Concat, [1]] 
  - [-1, 3, C2f_ACmix, [256]]  # 21 [Output: P3-Head용 데이터]

  - [-1, 1, Conv, [256, 3, 2]] # 22
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f_ACmix, [512]]  # 24 [Output: P4-Head용 데이터]

  - [-1, 1, Conv, [512, 3, 2]] # 25
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f_ACmix, [1024]] # 27 [Output: P5-Head용 데이터]

  - [[18, 21, 24, 27], 1, Detect, [nc]]  # 28